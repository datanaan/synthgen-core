<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#141428"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5d4"/>
      <stop offset="100%" style="stop-color:#00bbf9"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f72585"/>
      <stop offset="100%" style="stop-color:#b5179e"/>
    </linearGradient>
  </defs>

  <!-- Background: circle = universe -->
  <circle cx="200" cy="200" r="180" fill="url(#bg)" stroke="#00f5d4" stroke-width="1" opacity="0.2"/>

  <!-- Concentric rings = layers of reality -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#00bbf9" stroke-width="0.5" opacity="0.15"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#00bbf9" stroke-width="0.5" opacity="0.15"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#00bbf9" stroke-width="0.5" opacity="0.15"/>

  <!-- Grid lines = coordinate system of the universe -->
  <line x1="50" y1="200" x2="350" y2="200" stroke="#00f5d4" stroke-width="0.3" opacity="0.1"/>
  <line x1="200" y1="50" x2="200" y2="350" stroke="#00f5d4" stroke-width="0.3" opacity="0.1"/>

  <!-- DNA-like helix = data generation -->
  <path d="M130,110 Q170,140 130,170 Q90,200 130,230 Q170,260 130,290"
        fill="none" stroke="url(#neon)" stroke-width="2.5" opacity="0.4"/>
  <path d="M270,110 Q230,140 270,170 Q310,200 270,230 Q230,260 270,290"
        fill="none" stroke="url(#neon)" stroke-width="2.5" opacity="0.4"/>

  <!-- Horizontal connections = constraints -->
  <line x1="130" y1="140" x2="270" y2="140" stroke="#f72585" stroke-width="1" opacity="0.2"/>
  <line x1="130" y1="170" x2="270" y2="170" stroke="#f72585" stroke-width="1" opacity="0.2"/>
  <line x1="130" y1="230" x2="270" y2="230" stroke="#f72585" stroke-width="1" opacity="0.2"/>
  <line x1="130" y1="260" x2="270" y2="260" stroke="#f72585" stroke-width="1" opacity="0.2"/>

  <!-- Core crystal = the engine -->
  <polygon points="200,145 240,165 240,235 200,255 160,235 160,165"
           fill="none" stroke="url(#core)" stroke-width="2.5" opacity="0.7"/>

  <!-- Inner core glow -->
  <polygon points="200,160 228,174 228,226 200,240 172,226 172,174"
           fill="url(#core)" opacity="0.12"/>

  <!-- S G letters -->
  <text x="200" y="208" font-family="'Courier New', monospace" font-size="28"
        font-weight="bold" fill="url(#neon)" text-anchor="middle" opacity="0.9">S</text>
  <text x="200" y="228" font-family="'Courier New', monospace" font-size="12"
        fill="url(#neon)" text-anchor="middle" opacity="0.5">G</text>

  <!-- Bottom text: CORE -->
  <text x="200" y="335" font-family="'Courier New', monospace" font-size="12"
        fill="#00bbf9" text-anchor="middle" opacity="0.3" letter-spacing="6">CORE</text>
</svg>
