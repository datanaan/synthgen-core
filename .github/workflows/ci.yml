name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential rapidjson-dev libgtest-dev libgmock-dev
          # Build Google Test
          cd /usr/src/googletest
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build build -j$(nproc)
          sudo cmake --install build
          cd $GITHUB_WORKSPACE

      - name: Build Arrow from source
        run: |
          sudo apt-get install -y libssl-dev libsnappy-dev liblz4-dev libzstd-dev \
            libre2-dev libprotobuf-dev protobuf-compiler libutf8proc-dev libthrift-dev
          git clone --depth 1 --branch apache-arrow-18.1.0 https://github.com/apache/arrow.git /tmp/arrow
          cmake -S /tmp/arrow/cpp -B /tmp/arrow/build \
            -DARROW_BUILD_SHARED=ON -DARROW_BUILD_STATIC=OFF \
            -DARROW_PARQUET=ON -DARROW_FILESYSTEM=ON \
            -DARROW_WITH_SNAPPY=ON -DARROW_WITH_ZLIB=ON -DARROW_WITH_LZ4=ON \
            -DARROW_BUILD_TESTS=OFF -DARROW_BUILD_EXAMPLES=OFF \
            -DARROW_INSTALL_NAME_RPATH=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build /tmp/arrow/build -j$(nproc)
          sudo cmake --install /tmp/arrow/build
          sudo ldconfig
          rm -rf /tmp/arrow

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
